# Server copy for 82.156.7.147. Prebuilt image (docker load -i warcon-latest.tar), Baota's MySQL
# on the Docker host, every value literal — Baota's compose editor does not support ${VAR:-default}.
# nginx.conf must sit next to this file in the compose project directory.
x-warcon: &warcon
  image: warcon:latest
  # The Baota MySQL listens on the Docker host; host.docker.internal reaches it from a container.
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  environment: &warcon-env
    BETTER_AUTH_SECRET: 'ONaZbxk9jtn2/loL38dUjGUJpM5WK+1Q04rc3Gws534='
    ENCRYPTION_KEY: 'VmIRwoA4eOOonI++6b3zefuXxwoJQNZmYtcHzh6I00A='
    ORIGIN: 'http://www.slszd.cn'
    DATABASE_URL: 'mysql://warcon-1:4GZ4jZCpzz3bdY4M@host.docker.internal:3306/warcon-1'
    RELAY_SECRET: 'piQUJIICN5gqqJWsSxBIKFHk9q01Ge6L'
    RELAY_URL: 'http://worker:7700'
    ADDRESS_HEADER: 'x-forwarded-for'
    XFF_DEPTH: '1'

services:
  migrate:
    <<: *warcon
    environment:
      <<: *warcon-env
      WARCON_ROLE: migrate
    restart: 'no'

  warcon:
    <<: *warcon
    environment:
      <<: *warcon-env
      WARCON_ROLE: web
    restart: unless-stopped
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started

  worker:
    <<: *warcon
    environment:
      <<: *warcon-env
      WARCON_ROLE: worker
      WORKER_PORT: 7700
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.26.3
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - warcon
