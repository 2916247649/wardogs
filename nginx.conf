# Nginx 1.26.3 reverse proxy for Warcon.
# SvelteKit (adapter-node) listens on warcon:3000 inside the compose network.
upstream warcon_upstream {
    server warcon:3000;
    keepalive 32;
}

# WebSocket upgrade map (Connection header content depends on the Upgrade header).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow activation codes/SteamID in query strings and audit payloads through.
    client_max_body_size 8m;

    # Gzip text assets; event streams must never be buffered or gzipped.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://warcon_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Server-sent events: live observation stream. No buffering, no gzip, long-lived read.
    location ~ ^/events {
        proxy_pass http://warcon_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }
}
